<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Expense Tracker</title>
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;padding:32px;background:#f4f6fb;color:#172033}
main{max-width:1000px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}
h1{margin-bottom:5px}.muted{color:#69758a}.panel{background:white;padding:22px;border-radius:14px;margin-top:22px;box-shadow:0 5px 25px #1520440d}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-items:end}
label{display:block;font-size:13px;margin-bottom:6px;color:#69758a}input,select{width:100%;padding:11px;border:1px solid #d7dce6;border-radius:8px}
button{padding:11px 14px;border:0;border-radius:8px;background:#3157d5;color:white;cursor:pointer}.danger{background:#b42318}.stats{font-size:28px;font-weight:bold;margin-top:8px}
table{width:100%;border-collapse:collapse;margin-top:15px}th,td{text-align:left;padding:12px;border-bottom:1px solid #edf0f5}th{font-size:12px;color:#69758a;text-transform:uppercase}
.notice{margin-top:15px;color:#067647}.error{color:#b42318}.empty{padding:20px;text-align:center;color:#69758a}
</style></head><body><main>
<div class="top"><div><h1>Expense Tracker</h1><div class="muted">Keep an eye on where your money goes.</div></div><div><span class="muted">Total spent</span><div class="stats" id="total">₹0.00</div></div></div>
<section class="panel"><h2 id="formTitle">Add an expense</h2><form id="expenseForm">
<input id="editId" type="hidden"><div><label for="description">Description</label><input id="description" required placeholder="Groceries"></div>
<div><label for="category">Category</label><select id="category" required><option>Food</option><option>Transport</option><option>Shopping</option><option>Bills</option><option>Education</option><option>Health</option><option>Other</option></select></div>
<div><label for="amount">Amount (₹)</label><input id="amount" type="number" min="0.01" step="0.01" required></div>
<div><label for="expenseDate">Date</label><input id="expenseDate" type="date" required></div><button type="submit">Save expense</button><button type="button" id="cancel" style="display:none;background:#68738a">Cancel edit</button>
</form><p id="notice" class="notice"></p></section>
<section class="panel"><div class="top"><h2>Transactions</h2><div><label for="filter">Filter by category</label><select id="filter"><option value="">All categories</option><option>Food</option><option>Transport</option><option>Shopping</option><option>Bills</option><option>Education</option><option>Health</option><option>Other</option></select></div></div>
<table><thead><tr><th>Date</th><th>Description</th><th>Category</th><th>Amount</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="empty" style="display:none">No expenses found. Add your first expense above.</div></section>
</main>
<script>
const api='/api/expenses'; const $=id=>document.getElementById(id);
const today=new Date().toISOString().slice(0,10); $('expenseDate').value=today;
const money=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR'}).format(n);
async function request(url,options={}){const r=await fetch(url,{headers:{'Content-Type':'application/json'},...options});if(!r.ok){const body=await r.text();throw new Error(body||'Request failed')}return r.status===204?null:r.json()}
async function load(){try{const [items,summary]=await Promise.all([request(api+($('filter').value?'?category='+encodeURIComponent($('filter').value):'')),request(api+'/summary')]);$('total').textContent=money(summary.totalSpent);$('rows').innerHTML='';$('empty').style.display=items.length?'none':'block';items.forEach(e=>{const tr=document.createElement('tr');[e.expenseDate,e.description,e.category,money(e.amount)].forEach(value=>{const td=document.createElement('td');td.textContent=value;tr.appendChild(td)});const td=document.createElement('td');const edit=document.createElement('button');edit.textContent='Edit';edit.onclick=()=>startEdit(e);const del=document.createElement('button');del.textContent='Delete';del.className='danger';del.style.marginLeft='6px';del.onclick=()=>removeExpense(e.id);td.append(edit,del);tr.appendChild(td);$('rows').appendChild(tr)})}catch(e){$('notice').textContent='Could not load expenses: '+e.message;$('notice').className='error'}}
function startEdit(e){$('editId').value=e.id;$('description').value=e.description;$('category').value=e.category;$('amount').value=e.amount;$('expenseDate').value=e.expenseDate;$('formTitle').textContent='Edit expense';$('cancel').style.display='inline-block'}
function resetForm(){$('expenseForm').reset();$('editId').value='';$('expenseDate').value=today;$('formTitle').textContent='Add an expense';$('cancel').style.display='none'}
$('cancel').onclick=resetForm;$('filter').onchange=load;
$('expenseForm').onsubmit=async ev=>{ev.preventDefault();const id=$('editId').value;const payload={description:$('description').value.trim(),category:$('category').value,amount:Number($('amount').value),expenseDate:$('expenseDate').value};try{await request(id?api+'/'+id:api,{method:id?'PUT':'POST',body:JSON.stringify(payload)});$('notice').textContent='Expense saved successfully.';resetForm();await load()}catch(e){$('notice').textContent='Could not save expense. Check the fields and try again.';$('notice').className='error'}};
async function removeExpense(id){if(!confirm('Delete this expense?'))return;try{await request(api+'/'+id,{method:'DELETE'});$('notice').textContent='Expense deleted.';await load()}catch(e){$('notice').textContent='Could not delete expense.';$('notice').className='error'}}
load();
</script></body></html>
